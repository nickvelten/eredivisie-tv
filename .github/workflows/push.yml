name: Push notifications

# Triggers the "starts soon" and "full time" notifications for followers of a
# club. The endpoint is idempotent: every notification is sent only once.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 120 https://eredivisie.tv/api/push/run
